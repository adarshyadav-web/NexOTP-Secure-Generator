<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexOTP | Fast OTP Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo"><i class="fa-solid fa-key"></i> NexOTP</div>
            <h1>Generate One-Time Password</h1>
        </header>

        <div class="otp-display" id="otp-box">
            <span class="digit">0</span>
            <span class="digit">0</span>
            <span class="digit">0</span>
            <span class="digit">0</span>
        </div>

        <button id="generate-btn" class="btn-primary">GENERATE OTP</button>
        <p class="info">Click the button to generate a secure 4-digit code.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
